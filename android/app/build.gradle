plugins {
    id "com.android.application"
}

android {
    namespace "net.yapson.bible"
    compileSdk 34

    defaultConfig {
        applicationId "net.yapson.bible"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }

    signingConfigs {
        release {
            // Clé fixe du dépôt : les mises à jour s'installent par-dessus l'ancienne version.
            storeFile file("bible.keystore")
            storePassword "yapsonbible"
            keyAlias "bible"
            keyPassword "yapsonbible"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
