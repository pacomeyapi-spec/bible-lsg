name: Construire l'APK

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/BibleLSG.apk"
      - "!web/bible-lsg.epub"
      - "android/**"
      - "build.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Recopie web/ dans les assets Android (au cas où ils n'auraient pas été régénérés avant le push).
      - name: Synchroniser le site dans l'APK
        run: python3 -B build.py web/bible.json --sans-epub

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk BibleLSG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BibleLSG-apk
          path: BibleLSG.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bible LSG 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            La Bible Louis Segond 1910 (domaine public), entièrement hors ligne : lecture, recherche, favoris, notes, plans de lecture, lecture à voix haute.
            Télécharge **BibleLSG.apk** ci-dessous et installe-le sur ton téléphone Android.
          files: BibleLSG.apk

      # Copie l'APK sur le site Railway (web/) : téléchargement public via /apk sans compte GitHub.
      - name: Publier l'APK sur le site
        run: |
          cp BibleLSG.apk web/BibleLSG.apk
          git config user.name "pacomeyapi-spec"
          git config user.email "bot@yapson.net"
          git add web/BibleLSG.apk
          git commit -m "APK 1.0.${{ github.run_number }} sur le site" || exit 0
          git stash --include-untracked || true
          git pull --rebase origin main
          git push origin HEAD:main
